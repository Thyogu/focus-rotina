
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>FOCUS</title>
<style>
:root{--accent:#8b5cf6;--bg:#090909;--card:#171717;--text:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:22px}
header{padding:20px 0}
h1{font-size:34px;margin:0}
.sub{color:#999;margin-top:8px}
.card{background:var(--card);padding:18px;border-radius:16px;margin:15px 0}
input,button,select{padding:13px;border:0;border-radius:9px;font-size:15px}
input{background:#292929;color:white;width:100%;margin:6px 0}
button{background:var(--accent);color:white;font-weight:bold;cursor:pointer}
.add{width:100%;margin-top:8px}
.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #333}
.task input{width:20px;height:20px}
.task span{flex:1}
.done{text-decoration:line-through;color:#888}
.delete{background:#333;padding:8px 12px}
.stat{font-size:28px;font-weight:bold;margin:8px 0}
.bar{height:9px;background:#333;border-radius:20px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
small{color:#999}
</style>
</head>
<body>
<header>
<h1>FOCUS<span style="color:var(--accent)">.</span></h1>
<p class="sub">Organize sua rotina. Concentre-se no que importa.</p>
</header>

<div class="card">
<h2>Minha produtividade</h2>
<div class="tabs">
<button onclick="showPeriod('day')">Dia</button>
<button onclick="showPeriod('week')">Semana</button>
<button onclick="showPeriod('month')">Mês</button>
</div>
<div class="stat" id="percent">0%</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<p><small id="count">0 de 0 tarefas concluídas</small></p>
</div>

<div class="card">
<h2>Nova tarefa</h2>
<input id="taskName" placeholder="O que você precisa fazer?">
<button class="add" onclick="addTask()">+ Adicionar tarefa</button>
</div>

<div class="card">
<h2>Minha rotina</h2>
<div id="tasks"></div>
</div>

<div class="card">
<h2>Personalização</h2>
<p>Cor principal</p>
<input type="color" id="color" value="#8b5cf6" onchange="changeColor(this.value)">
</div>

<script>
let tasks=JSON.parse(localStorage.getItem('focusTasks')||'[]');
let period='day';

function save(){
 localStorage.setItem('focusTasks',JSON.stringify(tasks));
 render();
}

function addTask(){
 const input=document.getElementById('taskName');
 const name=input.value.trim();
 if(!name)return;
 tasks.push({id:Date.now(),name,done:false,date:new Date().toISOString().slice(0,10)});
 input.value='';
 save();
}

function toggleTask(id){
 const t=tasks.find(x=>x.id===id);
 if(t)t.done=!t.done;
 save();
}

function deleteTask(id){
 tasks=tasks.filter(x=>x.id!==id);
 save();
}

function showPeriod(p){
 period=p;
 render();
}

function render(){
 const today=new Date();
 const start=new Date(today);
 if(period==='week')start.setDate(today.getDate()-6);
 if(period==='month')start.setDate(today.getDate()-29);
 const selected=tasks.filter(t=>new Date(t.date+'T12:00:00')>=start);
 const total=selected.length;
 const completed=selected.filter(t=>t.done).length;
 const pct=total?Math.round(completed/total*100):0;
 document.getElementById('percent').textContent=pct+'%';
 document.getElementById('fill').style.width=pct+'%';
 document.getElementById('count').textContent=completed+' de '+total+' tarefas concluídas';

 document.getElementById('tasks').innerHTML=tasks.map(t=>
 `<div class="task">
 <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})">
 <span class="${t.done?'done':''}">${escapeHTML(t.name)}</span>
 <button class="delete" onclick="deleteTask(${t.id})">X</button>
 </div>`
 ).join('')||'<p class="sub">Nenhuma tarefa cadastrada.</p>';
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function changeColor(color){
 document.documentElement.style.setProperty('--accent',color);
 localStorage.setItem('focusColor',color);
}

const savedColor=localStorage.getItem('focusColor');
if(savedColor){
 document.getElementById('color').value=savedColor;
 changeColor(savedColor);
}
render();
</script>
</body>
</html>
